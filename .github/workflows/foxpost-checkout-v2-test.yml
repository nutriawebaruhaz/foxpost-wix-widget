name: FOXPOST checkout-v2 validation

on:
  push:
    branches:
      - checkout-v2
    paths:
      - 'wix-app/**'
      - '.github/workflows/foxpost-checkout-v2-test.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core-flow-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install test runner
        run: npm install --no-save tsx@latest typescript@latest @types/node@latest

      - name: Run FOXPOST flow tests
        run: npx tsx wix-app/tests/foxpost-core.test.ts

  wix-source-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Wix SDK and TypeScript dependencies
        run: >
          npm install --no-save
          typescript@latest
          @types/node@latest
          @types/react@18
          @types/react-dom@18
          react@18.3.1
          react-dom@18.3.1
          @wix/ecom@latest
          @wix/astro@latest
          @wix/dashboard@latest
          @wix/design-system@latest
          @wix/editor@latest

      - name: Inspect currentCartV2 SDK signatures
        run: |
          grep -R "updateCurrentCart" node_modules/@wix/ecom/dist -n | head -40 || true
          grep -R "updateCurrentCart" node_modules/@wix/ecom -n --include='*.d.ts' | head -40 || true

      - name: Type-check FOXPOST Wix sources
        run: >
          npx tsc --noEmit
          --strict
          --noImplicitAny
          --strictNullChecks
          --exactOptionalPropertyTypes
          --noUncheckedIndexedAccess
          --skipLibCheck
          --target ES2022
          --module ESNext
          --moduleResolution Bundler
          --jsx react-jsx
          --lib ES2022,DOM
          wix-app/src/extensions.ts
          wix-app/src/lib/foxpost-core.ts
          wix-app/src/extensions/site/plugins/foxpost-checkout/foxpost-checkout.tsx
          wix-app/src/extensions/site/plugins/foxpost-checkout/foxpost-checkout.panel.tsx
          wix-app/src/extensions/site/plugins/foxpost-checkout/foxpost-checkout.extension.ts
          wix-app/src/extensions/backend/service-plugins/foxpost-shipping-rates/foxpost-shipping-rates.ts
          wix-app/src/extensions/backend/service-plugins/foxpost-shipping-rates/foxpost-shipping-rates.extension.ts
          wix-app/src/extensions/backend/service-plugins/foxpost-validation/foxpost-validation.ts
          wix-app/src/extensions/backend/service-plugins/foxpost-validation/foxpost-validation.extension.ts
          wix-app/src/extensions/dashboard/pages/foxpost-setup/foxpost-setup.tsx
          wix-app/src/extensions/dashboard/pages/foxpost-setup/foxpost-setup.extension.ts

  no-release-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify test workflow cannot publish
        run: |
          if grep -R -E "wix[[:space:]]+(release|deploy)|npm[[:space:]]+run[[:space:]]+(release|deploy)" .github/workflows/foxpost-checkout-v2-test.yml; then
            echo "Publish/release command found in test workflow."
            exit 1
          fi
          echo "No release or deploy command present."
